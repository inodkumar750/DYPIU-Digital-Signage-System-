name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-tv-app/**'
      - '.github/workflows/android.yml'

jobs:
  apk:
    name: Build signed NEXORA-TV.apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release keystore (repository secret)
        env:
          KS_B64: ${{ secrets.NEXORA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/nexora-release.jks"
            echo "NEXORA_KEYSTORE=$RUNNER_TEMP/nexora-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::NEXORA_KEYSTORE_B64 secret missing - APK will be signed with the DEBUG key and cannot update TVs that run the release-signed app."
          fi
      - name: Build
        env:
          NEXORA_KEYSTORE_PASSWORD: ${{ secrets.NEXORA_KEYSTORE_PASSWORD }}
          NEXORA_KEY_ALIAS: ${{ secrets.NEXORA_KEY_ALIAS }}
          NEXORA_KEY_PASSWORD: ${{ secrets.NEXORA_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - name: Summary
        run: |
          APK=app/build/outputs/apk/release/NEXORA-TV.apk
          sha256sum "$APK"
          echo "### NEXORA-TV.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: \`$(sha256sum $APK | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Copy the artifact to public/NEXORA-TV.apk and set versionCode/versionName in server/ota.json." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-TV-apk
          path: android-tv-app/app/build/outputs/apk/release/NEXORA-TV.apk
          retention-days: 90

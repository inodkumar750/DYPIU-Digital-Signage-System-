name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Backend unit tests
        run: npm test
      - name: Build CMS + TV player
        run: npm run build
      - name: Syntax-check server
        run: for f in server/*.js server/*/*.js; do node --check "$f"; done

  deploy:
    name: Deploy to campus server
    needs: test
    # Only deploy from main (never from pull requests)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, nexora]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with Docker Compose (health-checked, auto-rollback)
        run: bash deploy/deploy.sh
      - name: Show running containers
        if: always()
        run: docker compose -p nexora --env-file /opt/nexora/.env ps

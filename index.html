<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#290044" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/tv-icon.svg" />
    <title>NEXORA — DYPIU Digital Signage</title>
    <meta
      name="description"
      content="Centralized digital signage management dashboard for university IT teams to organize campus TV screens, manage media libraries, build playlists, schedule campaigns, and monitor playback."
    />
    <meta property="og:title" content="NEXORA — DYPIU Digital Signage" />
    <meta
      property="og:description"
      content="Centralized digital signage management dashboard for university IT teams to organize campus TV screens, manage media libraries, build playlists, schedule campaigns, and monitor playback."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      *, *::before, *::after { box-sizing: border-box; }
    </style>
  </head>
  <body class="bg-[#FAF8FC] text-[#1A1025] antialiased selection:bg-[#EEE3B0] selection:text-[#290044]">
    <div id="root"></div>
    <script>
      (function () {
        var q = window.location.search || '';
        var isTvMode = q.indexOf('tv=') !== -1 || q.indexOf('player') !== -1 || q.indexOf('kiosk=') !== -1 || q.indexOf('cast=') !== -1;
        if (!isTvMode) return;
        document.documentElement.style.backgroundColor = '#0F051D';
        document.body.style.backgroundColor = '#0F051D';

        function goCompat() {
          var root = document.getElementById('root');
          if (!root || !root.firstChild) {
            window.location.replace('/tv-compat.html' + q);
          }
        }
        window.addEventListener('error', function () {
          setTimeout(goCompat, 300);
        });
        setTimeout(goCompat, 2500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

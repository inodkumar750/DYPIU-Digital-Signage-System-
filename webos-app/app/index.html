<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA TV — DYPIU Digital Signage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: #0F051D;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
      gap: 20px;
    }
    .logo-wrap {
      width: 140px; height: 140px;
      background: #fff;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 40px rgba(80,0,113,0.6);
    }
    .logo-wrap img { width: 120px; height: 120px; object-fit: contain; }
    h1 {
      font-size: 52px;
      font-weight: 800;
      color: #EEE3B0;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 18px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 1px;
    }
    .dots { display: flex; gap: 8px; margin-top: 10px; }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #500071;
      animation: pulse 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; background: #8A2A78; }
    .dot:nth-child(3) { animation-delay: 0.4s; background: #EEE3B0; }
    @keyframes pulse {
      0%, 100% { transform: scale(0.6); opacity: 0.4; }
      50% { transform: scale(1); opacity: 1; }
    }
    .error-box {
      display: none;
      background: rgba(255,60,60,0.15);
      border: 1px solid rgba(255,60,60,0.4);
      border-radius: 12px;
      padding: 16px 28px;
      font-size: 15px;
      color: #ffaaaa;
      text-align: center;
      max-width: 500px;
    }

    .setup { display:none; width:min(640px,90vw); background:rgba(255,255,255,0.06); border:1px solid rgba(238,227,176,0.25); border-radius:16px; padding:24px 28px; }
    .setup label { display:block; font-size:14px; color:rgba(255,255,255,0.7); margin:12px 0 4px; }
    .setup input { width:100%; padding:12px 14px; font-size:18px; border-radius:8px; border:2px solid #500071; background:#1a0830; color:#fff; }
    .se<script>
    // ─── CONFIG (set once on this TV; stored locally, nothing hard-coded) ───
    var LS = window.localStorage;
    function cfg() {
      return {
        server: (LS.getItem('nexora_server') || '').replace(/\/+$/, ''),
        screen: LS.getItem('nexora_screen') || '',
        key: LS.getItem('nexora_key') || ''
      };
    }
    function $(id) { return document.getElementById(id); }

    function playerUrl(c) {
      // The player is served by the same server (production build on :5000, or dev server on :3000).
      var url = c.server + '/tv?kiosk=1&ticker=1&tv=' + encodeURIComponent(c.screen);
      if (c.key) url += '&key=' + encodeURIComponent(c.key);
      return url;
    }

    function showError(msg) { var b = $('errBox'); b.style.display = 'block'; b.textContent = msg; }

    var retryTimer = null;
    function showSetup() {
      clearTimeout(retryTimer);
      var c = cfg();
      $('srv').value = c.server; $('scr').value = c.screen; $('key').value = c.key;
      $('setup').style.display = 'block';
      $('srv').focus();
    }

    function tryConnect(attempt) {
      var c = cfg();
      if (!c.server || !c.screen) { showSetup(); return; }
      attempt = attempt || 1;
      var img = new Image();
      var done = false;
      var timeout = setTimeout(function () { if (!done) { done = true; fail(); } }, 6000);
      function fail() {
        if (attempt < 5) {
          showError('Connecting to NEXORA server... (attempt ' + attempt + '/5)');
          retryTimer = setTimeout(function () { tryConnect(attempt + 1); }, 3000);
        } else {
          showError('Cannot reach ' + c.server + '. Check Wi-Fi / server address (press YELLOW to edit). Retrying in 10 seconds...');
          retryTimer = setTimeout(function () { tryConnect(1); }, 10000);
        }
      }
      img.onload = function () { if (done) return; done = true; clearTimeout(timeout); window.location.replace(playerUrl(c)); };
      img.onerror = function () { if (done) return; done = true; clearTimeout(timeout); fail(); };
      img.src = c.server + '/dypiu-logo.png?t=' + Date.now();
    }

    $('save').onclick = function () {
      var srv = $('srv').value.trim();
      if (srv && !/^https?:\/\//i.test(srv)) srv = 'http://' + srv;
      LS.setItem('nexora_server', srv);
      LS.setItem('nexora_screen', $('scr').value.trim());
      LS.setItem('nexora_key', $('key').value.trim());
      $('setup').style.display = 'none';
      $('errBox').style.display = 'none';
      tryConnect(1);
    };

    // YELLOW (405) or "S" opens the settings form
    document.addEventListener('keydown', function (e) {
      if (e.keyCode === 405 || e.keyCode === 83) showSetup();
    });

    setTimeout(function () { tryConnect(1); }, 1500);
  </script>
</body>
</html>

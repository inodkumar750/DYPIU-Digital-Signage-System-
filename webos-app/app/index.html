<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DYPIU OS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0F051D; color: #fff;
      font-family: 'LG Smart UI', 'Segoe UI', Arial, sans-serif; }
    body { background: #0F051D; }

    /* Scenes: own gradient artwork that follows the time of day */
    #scene { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
    body.s-morning #scene { background: radial-gradient(ellipse at 15% 10%, #b8508a 0%, #6a2a78 38%, #25104a 75%, #0F051D 100%); }
    body.s-day     #scene { background: radial-gradient(ellipse at 80% 0%, #8A2A78 0%, #500071 40%, #1d0a38 78%, #0F051D 100%); }
    body.s-evening #scene { background: radial-gradient(ellipse at 20% 100%, #c2563f 0%, #7a2a62 35%, #2a0c48 72%, #0F051D 100%); }
    body.s-night   #scene { background: radial-gradient(ellipse at 50% 0%, #3a1368 0%, #1a0834 50%, #0a0314 100%); }
    #scene:after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to top, rgba(8,2,16,.78) 0%, rgba(8,2,16,0) 52%); }

    /* Signage player (NEXORA) lives underneath the home screen */
    #player { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; border: 0; background: #000; visibility: hidden; }
    body.signage #player { visibility: visible; }
    body.signage #home, body.signage #scene { display: none; }

    /* Home */
    #home { position: fixed; top: 0; left: 0; right: 0; bottom: 0; padding: 44px 64px 40px; display: flex; flex-direction: column; }
    .top { display: flex; align-items: flex-start; justify-content: space-between; }
    .hello .greet { font-size: 30px; color: rgba(255,255,255,.75); letter-spacing: 1px; }
    .hello .time { font-size: 150px; font-weight: 200; line-height: 1.02; letter-spacing: 2px; text-shadow: 0 6px 40px rgba(0,0,0,.35); }
    .hello .date { font-size: 28px; color: rgba(255,255,255,.7); margin-top: 4px; }
    .pill { display: flex; align-items: center; gap: 14px; padding: 10px 24px 10px 12px; border-radius: 40px;
      background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); }
    .pill .lg { width: 52px; height: 52px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; }
    .pill .lg img { width: 40px; height: 40px; object-fit: contain; }
    .pill .nm { font-size: 22px; font-weight: 700; letter-spacing: 2px; color: #EEE3B0; }
    .pill .tg { font-size: 14px; color: rgba(255,255,255,.65); }
    .pill .st { display: flex; align-items: center; gap: 8px; font-size: 15px; color: rgba(255,255,255,.7); margin-left: 12px; padding-left: 18px; border-left: 1px solid rgba(255,255,255,.2); }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: #777; }
    .dot.on { background: #34d399; box-shadow: 0 0 10px #34d399; }

    .main { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 26px; }
    .focus-name { font-size: 60px; font-weight: 700; text-shadow: 0 4px 30px rgba(0,0,0,.5); }
    .focus-sub { font-size: 24px; color: rgba(255,255,255,.7); margin-top: 6px; }
    .banner { min-height: 32px; font-size: 20px; color: #EEE3B0; margin-top: 14px; }

    /* Dock */
    .dock { position: relative; overflow: hidden; border-radius: 34px; padding: 26px 0 40px;
      background: rgba(255,255,255,.13); border: 1.5px solid rgba(255,255,255,.28);
      -webkit-backdrop-filter: blur(28px); backdrop-filter: blur(28px); box-shadow: 0 20px 60px rgba(0,0,0,.4); }
    .tiles { display: flex; align-items: flex-start; gap: 30px; padding: 0 36px; transition: transform .25s ease; }
    .tile { flex: 0 0 auto; width: 176px; text-align: center; position: relative; cursor: pointer; }
    .tile .box { width: 176px; height: 110px; border-radius: 18px; background: linear-gradient(160deg, rgba(255,255,255,.22), rgba(255,255,255,.07));
      border: 1px solid rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,.28); transition: transform .15s ease, box-shadow .15s ease, background .15s ease; }
    .tile svg { width: 56px; height: 56px; stroke: #fff; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .tile .lbl { margin-top: 14px; font-size: 20px; color: rgba(255,255,255,0); transition: color .15s ease; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile.focus .box { transform: scale(1.18); background: linear-gradient(160deg, rgba(255,255,255,.95), rgba(238,227,176,.8)); box-shadow: 0 18px 44px rgba(0,0,0,.5); }
    .tile.focus svg { stroke: #500071; }
    .tile.focus .lbl { color: #fff; margin-top: 22px; }
    .tile.primary .box { background: linear-gradient(135deg, #500071, #8A2A78); border-color: rgba(238,227,176,.5); }
    .tile.primary .box img { width: 84px; height: 84px; background: #fff; border-radius: 16px; padding: 6px; object-fit: contain; }
    .tile.primary.focus .box { background: linear-gradient(135deg, #6a1090, #b0409a); }
    .foot { display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: rgba(255,255,255,.4); margin-top: 16px; }

    /* ── Staff overlay ── */
    #overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(8,2,16,.88); display: none; align-items: center; justify-content: center; z-index: 10; }
    #overlay.show { display: flex; }
    .card { width: 640px; background: #1a0830; border: 2px solid rgba(238,227,176,.35); border-radius: 26px; padding: 34px 40px; }
    .card h2 { font-size: 30px; color: #EEE3B0; margin-bottom: 8px; }
    .card .sub { font-size: 17px; color: rgba(255,255,255,.6); margin-bottom: 20px; }
    .pin { font-size: 52px; letter-spacing: 18px; text-align: center; min-height: 72px; font-family: monospace; }
    .err { color: #ff9a9a; text-align: center; min-height: 26px; font-size: 18px; }
    .btn { display: block; width: 100%; margin-top: 12px; padding: 16px 20px; font-size: 22px; font-weight: 600; text-align: left;
      color: #fff; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.12); border-radius: 14px; cursor: pointer; }
    .btn.focus { border-color: #EEE3B0; background: rgba(238,227,176,.18); }
    .card input { width: 100%; padding: 14px; font-size: 22px; border-radius: 10px; border: 2px solid #500071; background: #0F051D; color: #fff; margin-top: 8px; }
    .about { font-size: 15px; color: rgba(255,255,255,.5); margin-top: 18px; line-height: 1.6; }
  </style>
</head>
<body>
  <iframe id="player" allow="autoplay; fullscreen"></iframe>

  <div id="scene"></div>
  <div id="home">
    <div class="top">
      <div class="hello">
        <div class="greet" id="greet">Welcome</div>
        <div class="time" id="time">--:--</div>
        <div class="date" id="date"></div>
      </div>
      <div class="pill">
        <div class="lg"><img src="largeIcon.png" alt="DYPIU"></div>
        <div><div class="nm" id="brandName">DYPIU OS</div><div class="tg" id="brandTag">D. Y. Patil International University</div></div>
        <div class="st"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
      </div>
    </div>
    <div class="main">
      <div class="focus-name" id="focusName"></div>
      <div class="focus-sub" id="focusSub"></div>
      <div class="banner" id="banner"></div>
    </div>
    <div class="dock"><div class="tiles" id="tiles"></div></div>
    <div class="foot">
      <span>Arrow keys and OK &nbsp;·&nbsp; YELLOW button: staff menu</span>
      <span id="ver">DYPIU OS 1.2 &nbsp;·&nbsp; dock design inspired by tvOS Launcher (Apache-2.0)</span>
    </div>
  </div>

  <div id="overlay"><div class="card" id="card"></div></div>

  <script>
    // ─── DYPIU OS shell ────────────────────────────────────────────────────────
    var DEFAULT_SERVER = '__NEXORA_SERVER__'; // replaced when the IPK is built
    var OS_VERSION = '1.2';
    var LS = window.localStorage;
    function $(id) { return document.getElementById(id); }
    function server() { return (LS.getItem('nexora_server') || DEFAULT_SERVER).replace(/\/+$/, ''); }

    // Built-in defaults: the home screen still works when the server cannot be reached.
    var cfg = {
      brand: { name: 'DYPIU OS', tagline: 'D. Y. Patil International University' },
      bootSeconds: 10, idleSeconds: 120,
      apps: [
        { id: 'youtube.leanback.v4', label: 'YouTube', icon: 'play' },
        { id: 'com.webos.app.browser', label: 'Web Browser', icon: 'globe' },
        { id: 'com.webos.app.hdmi1', label: 'HDMI 1', icon: 'hdmi' },
        { id: 'com.webos.app.hdmi2', label: 'HDMI 2', icon: 'hdmi' },
        { id: 'com.webos.app.livetv', label: 'Live TV', icon: 'tv' },
        { id: 'com.palm.app.settings', label: 'TV Settings', icon: 'gear' }
      ]
    };

    var ICONS = {
      play: '<rect x="3" y="5" width="18" height="14" rx="4"/><path d="M10 9l5 3-5 3z"/>',
      globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
      hdmi: '<path d="M4 8h16v6l-3 4H7l-3-4z"/><path d="M8 11h8"/>',
      tv: '<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>',
      cast: '<path d="M4 18a3 3 0 013 3M4 14a7 7 0 017 7M4 10a11 11 0 0111 11"/><path d="M4 6h16v13h-5"/>',
      photo: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/>',
      film: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M8 6l-2 4M13 6l-2 4M18 6l-2 4"/>',
      gear: '<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
      app: '<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>'
    };

    // ── State ──
    var view = 'home';            // 'home' | 'signage'
    var pairing = false;          // the signage page is showing a pairing code
    var paired = LS.getItem('dypiu_paired') === '1';
    var screenName = LS.getItem('dypiu_screen_name') || '';
    var overlayMode = '';         // '' | 'pin' | 'staff' | 'form'
    var focusIdx = 0, tileEls = [];
    var bootLeft = 0, bootTimer = null, idleTimer = null;

    // ── Luna (system service) bridge ──
    function luna(uri, params, cb) {
      if (typeof PalmServiceBridge === 'undefined') { if (cb) cb({ returnValue: false, errorText: 'not on a TV' }); return; }
      var b = new PalmServiceBridge();
      b.onservicecallback = function (m) { var j = {}; try { j = JSON.parse(m); } catch (e) {} if (cb) cb(j); };
      b.call(uri, JSON.stringify(params || {}));
    }
    function launchApp(id) { luna('luna://com.webos.applicationManager/launch', { id: id }); }

    // ── Rendering ──
    function renderBrand() { $('brandName').textContent = cfg.brand.name; $('brandTag').textContent = cfg.brand.tagline; }
    function renderTiles() {
      var box = $('tiles'); box.innerHTML = ''; tileEls = [];
      var first = document.createElement('div');
      first.className = 'tile primary'; first.tabIndex = -1;
      first.setAttribute('data-sub', 'Campus digital signage');
      first.setAttribute('data-name', 'NEXORA');
      first.innerHTML = '<div class="box"><img src="largeIcon.png" alt=""></div><div class="lbl">NEXORA</div>';
      first.onclick = function () { showSignage(); };
      box.appendChild(first); tileEls.push(first);
      cfg.apps.forEach(function (a) {
        var t = document.createElement('div');
        var label = String(a.label).replace(/</g, '&lt;');
        t.className = 'tile'; t.tabIndex = -1;
        t.setAttribute('data-name', a.label); t.setAttribute('data-sub', 'Open app');
        t.innerHTML = '<div class="box"><svg viewBox="0 0 24 24">' + (ICONS[a.icon] || ICONS.app) + '</svg></div><div class="lbl">' + label + '</div>';
        t.onclick = function () { launchApp(a.id); };
        box.appendChild(t); tileEls.push(t);
      });
      tileEls.forEach(function (t, i) { t.onmouseenter = function () { setFocus(i); }; });
      setFocus(Math.min(focusIdx, tileEls.length - 1));
    }
    function setFocus(i) {
      focusIdx = i;
      tileEls.forEach(function (t, k) { t.className = t.className.replace(' focus', '') + (k === i ? ' focus' : ''); });
      var el = tileEls[i];
      if (el) {
        $('focusName').textContent = el.getAttribute('data-name');
        $('focusSub').textContent = el.getAttribute('data-sub');
        // keep the focused tile inside the dock: slide the track when it would run off the right edge
        var tw = 206, viewW = window.innerWidth - 128 - 72, maxScroll = Math.max(0, tileEls.length * tw - viewW);
        var off = Math.min(maxScroll, Math.max(0, (i + 1) * tw - viewW));
        $('tiles').style.transform = 'translateX(' + (-off) + 'px)';
      }
    }
    var sceneName = 'day';
    function applyBodyClass() { document.body.className = (view === 'signage' ? 'signage ' : '') + 's-' + sceneName; }
    function tickClock() {
      var d = new Date();
      var h = d.getHours(), m = d.getMinutes();
      $('time').textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
      var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'], mons = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      $('date').textContent = days[d.getDay()] + ', ' + d.getDate() + ' ' + mons[d.getMonth()] + ' ' + d.getFullYear();
      sceneName = h >= 5 && h < 11 ? 'morning' : h >= 11 && h < 17 ? 'day' : h >= 17 && h < 20 ? 'evening' : 'night';
      $('greet').textContent = h >= 5 && h < 12 ? 'Good morning' : h >= 12 && h < 17 ? 'Good afternoon' : h >= 17 && h < 21 ? 'Good evening' : 'Good night';
      applyBodyClass();
    }
    function setStatus(ok) {
      $('dot').className = 'dot' + (ok ? ' on' : '');
      $('statusText').textContent = ok ? (screenName ? screenName + ' · connected' : 'Connected to NEXORA') : 'Server not reachable';
    }

    // ── Views ──
    function playerSrc() {
      var url = server() + '/tv?kiosk=1&ticker=1&embedded=1';
      var s = LS.getItem('nexora_screen'), k = LS.getItem('nexora_key');
      if (s) url += '&tv=' + encodeURIComponent(s);
      if (k) url += '&key=' + encodeURIComponent(k);
      return url;
    }
    function showSignage() {
      clearTimeout(idleTimer); stopBoot();
      view = 'signage'; applyBodyClass();
      try { $('player').contentWindow.focus(); } catch (e) {}
    }
    function showHome() {
      view = 'home'; applyBodyClass();
      try { $('player').blur(); } catch (e) {}
      window.focus(); armIdle();
    }
    function armIdle() {
      clearTimeout(idleTimer);
      if (view !== 'home' || overlayMode) return;
      idleTimer = setTimeout(showSignage, cfg.idleSeconds * 1000);
    }
    function stopBoot() { clearInterval(bootTimer); bootTimer = null; $('banner').textContent = ''; }
    function startBoot() {
      bootLeft = cfg.bootSeconds;
      if (bootLeft <= 0) { showSignage(); return; }
      var draw = function () { $('banner').textContent = 'NEXORA signage starts in ' + bootLeft + ' s — press any key to stay on the home screen'; };
      draw();
      bootTimer = setInterval(function () { bootLeft--; if (bootLeft <= 0) { showSignage(); } else { draw(); } }, 1000);
    }

    // ── Staff overlay (PIN → menu) ──
    var pinBuf = '', staffEls = [], staffIdx = 0;
    function closeOverlay() {
      overlayMode = ''; $('overlay').className = '';
      if (view === 'home') armIdle(); else { try { $('player').contentWindow.focus(); } catch (e) {} }
    }
    function openPin() {
      clearTimeout(idleTimer); stopBoot();
      overlayMode = 'pin'; pinBuf = ''; $('overlay').className = 'show';
      drawPin('');
    }
    function drawPin(err) {
      $('card').innerHTML = '<h2>Staff access</h2><div class="sub">Enter the staff PIN with the number keys, then press OK. BACK cancels.</div>' +
        '<div class="pin">' + new Array(pinBuf.length + 1).join('•') + '</div><div class="err">' + (err || '') + '</div>';
    }
    function checkPin() {
      var x = new XMLHttpRequest();
      x.open('POST', server() + '/api/v1/device/staff-pin', true);
      x.setRequestHeader('Content-Type', 'application/json');
      x.onreadystatechange = function () {
        if (x.readyState !== 4) return;
        var ok = false; try { ok = JSON.parse(x.responseText).ok === true; } catch (e) {}
        if (ok) openStaff();
        else { pinBuf = ''; drawPin(x.status === 429 ? 'Too many attempts — wait a minute' : (x.status === 0 ? 'Server not reachable' : 'Wrong PIN')); }
      };
      x.send(JSON.stringify({ pin: pinBuf }));
    }
    function openStaff() {
      overlayMode = 'staff'; staffIdx = 0;
      var items = [
        ['Show NEXORA signage now', function () { closeOverlay(); showSignage(); }],
        ['Re-pair this TV (new pairing code)', function () {
          LS.removeItem('nexora_screen'); LS.removeItem('nexora_key'); LS.setItem('dypiu_paired', '0'); paired = false; screenName = '';
          $('player').src = server() + '/tv?kiosk=1&ticker=1&embedded=1&pair=1'; closeOverlay(); showSignage(); }],
        ['Change server address', function () { drawServerForm(); }],
        ['Restart DYPIU OS', function () { window.location.reload(); }],
        ['Exit to LG home screen', function () { launchApp('com.webos.app.home'); }],
        ['Close', function () { closeOverlay(); }]
      ];
      var html = '<h2>Staff menu</h2><div class="sub">DYPIU OS ' + OS_VERSION + '</div>';
      items.forEach(function (it, i) { html += '<div class="btn" data-i="' + i + '">' + it[0] + '</div>'; });
      html += '<div class="about">Server: ' + server() + '<br>Screen: ' + (LS.getItem('nexora_screen') || screenName || 'not paired yet') + '</div>';
      $('card').innerHTML = html;
      staffEls = Array.prototype.slice.call($('card').querySelectorAll('.btn'));
      staffEls.forEach(function (el, i) { el.onclick = items[i][1]; el.onmouseenter = function () { setStaffFocus(i); }; });
      setStaffFocus(0);
    }
    function setStaffFocus(i) { staffIdx = i; staffEls.forEach(function (e, k) { e.className = 'btn' + (k === i ? ' focus' : ''); }); }
    function drawServerForm() {
      overlayMode = 'form';
      $('card').innerHTML = '<h2>Server address</h2><div class="sub">Example: http://10.100.0.39:5000</div>' +
        '<input id="srvIn" type="text" value="' + server() + '"><div class="btn focus" id="srvSave">Save and restart</div><div class="btn" id="srvCancel">Cancel</div>';
      $('srvSave').onclick = function () {
        var v = $('srvIn').value.trim(); if (v && !/^https?:\/\//i.test(v)) v = 'http://' + v;
        LS.setItem('nexora_server', v.replace(/\/+$/, '')); window.location.reload();
      };
      $('srvCancel').onclick = function () { openStaff(); };
      $('srvIn').focus();
    }

    // ── Keys (remote control) ──
    var BACK = [461, 27, 8, 10009];
    function onKey(code) {
      if (code === 405) { if (!overlayMode) openPin(); return true; }       // YELLOW
      if (overlayMode === 'pin') {
        if (code >= 48 && code <= 57 && pinBuf.length < 8) { pinBuf += String(code - 48); drawPin(''); }
        else if (code === 13 && pinBuf.length >= 4) checkPin();
        else if (BACK.indexOf(code) >= 0) closeOverlay();
        return true;
      }
      if (overlayMode === 'staff') {
        if (code === 38 || code === 37) setStaffFocus(Math.max(0, staffIdx - 1));
        else if (code === 40 || code === 39) setStaffFocus(Math.min(staffEls.length - 1, staffIdx + 1));
        else if (code === 13) staffEls[staffIdx].click();
        else if (BACK.indexOf(code) >= 0) closeOverlay();
        return true;
      }
      if (overlayMode === 'form') { if (BACK.indexOf(code) >= 0 && document.activeElement && document.activeElement.id !== 'srvIn') openStaff(); return false; }
      // home screen
      stopBoot(); armIdle();
      if (code === 39 || code === 40) setFocus(Math.min(tileEls.length - 1, focusIdx + 1));
      else if (code === 37 || code === 38) setFocus(Math.max(0, focusIdx - 1));
      else if (code === 13) tileEls[focusIdx].click();
      return true; // never let BACK close DYPIU OS
    }
    document.addEventListener('keydown', function (e) {
      if (view === 'signage' && !overlayMode) return;
      if (onKey(e.keyCode)) e.preventDefault();
    });
    document.addEventListener('mousemove', function () { if (view === 'home' && !overlayMode) { stopBoot(); armIdle(); } });

    // ── Messages from the signage page ──
    window.addEventListener('message', function (e) {
      var m = e.data; if (!m || m.type !== 'dypiu-os') return;
      if (m.event === 'ready') {
        pairing = false; paired = true; LS.setItem('dypiu_paired', '1');
        if (m.screenName) { screenName = m.screenName; LS.setItem('dypiu_screen_name', screenName); }
        setStatus(true);
      } else if (m.event === 'pairing') {
        pairing = true; paired = false; LS.setItem('dypiu_paired', '0'); showSignage();
      } else if (m.event === 'attention') {
        if (view !== 'signage') showSignage();             // identify / urgent message from the Control Center
      } else if (m.event === 'key') {
        if (m.code === 405) { openPin(); return; }
        if (pairing || overlayMode) return;                // the pairing code stays on screen
        if (view === 'signage') showHome();                // any key brings the home screen back
      }
    });

    // ── Config from the server (optional: built-in defaults work offline) ──
    function loadConfig() {
      var x = new XMLHttpRequest();
      x.open('GET', server() + '/api/v1/device/os-config?platform=webos', true);
      x.timeout = 8000;
      x.onreadystatechange = function () {
        if (x.readyState !== 4) return;
        if (x.status === 200) {
          try {
            var c = JSON.parse(x.responseText).config;
            if (c && c.apps) { cfg = c; renderBrand(); renderTiles(); }
            setStatus(true);
          } catch (e) { setStatus(false); }
        } else setStatus(false);
      };
      x.send();
    }

    // ── Start ──
    renderBrand(); renderTiles(); tickClock(); setInterval(tickClock, 10000);
    setStatus(false);
    $('player').src = playerSrc();                 // signage starts loading in the background right away
    loadConfig(); setInterval(loadConfig, 600000);
    if (!paired) { showSignage(); }                // a new TV goes straight to the pairing code
    else { showHome(); startBoot(); }
  </script>
</body>
</html>

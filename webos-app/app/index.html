<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA TV — DYPIU Digital Signage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: #0F051D;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
      gap: 20px;
    }
    .logo-wrap {
      width: 140px; height: 140px;
      background: #fff;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 40px rgba(80,0,113,0.6);
    }
    .logo-wrap img { width: 120px; height: 120px; object-fit: contain; }
    h1 {
      font-size: 52px;
      font-weight: 800;
      color: #EEE3B0;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 18px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 1px;
    }
    .dots { display: flex; gap: 8px; margin-top: 10px; }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #500071;
      animation: pulse 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; background: #8A2A78; }
    .dot:nth-child(3) { animation-delay: 0.4s; background: #EEE3B0; }
    @keyframes pulse {
      0%, 100% { transform: scale(0.6); opacity: 0.4; }
      50% { transform: scale(1); opacity: 1; }
    }
    .error-box {
      display: none;
      background: rgba(255,60,60,0.15);
      border: 1px solid rgba(255,60,60,0.4);
      border-radius: 12px;
      padding: 16px 28px;
      font-size: 15px;
      color: #ffaaaa;
      text-align: center;
      max-width: 500px;
    }

    .setup { display:none; width:min(640px,90vw); background:rgba(255,255,255,0.06); border:1px solid rgba(238,227,176,0.25); border-radius:16px; padding:24px 28px; }
    .setup label { display:block; font-size:14px; color:rgba(255,255,255,0.7); margin:12px 0 4px; }
    .setup input { width:100%; padding:12px 14px; font-size:18px; border-radius:8px; border:2px solid #500071; background:#1a0830; color:#fff; }
    .setup input:focus, .setup button:focus { outline: none; border-color: #EEE3B0; box-shadow: 0 0 0 3px rgba(238,227,176,0.35); }
    .setup button { margin-top:20px; width:100%; padding:14px; font-size:20px; font-weight:700; color:#290044; background:#EEE3B0; border:2px solid transparent; border-radius:10px; cursor:pointer; }
    .setup .hint { margin-top:14px; font-size:13px; color:rgba(255,255,255,0.5); text-align:center; }
    .setup h2 { font-size:22px; color:#EEE3B0; margin-bottom:4px; }
  </style>
</head>
<body>
  <div class="splash" id="splash">
    <div class="logo-wrap">
      <img src="largeIcon.png" alt="DYPIU Logo">
    </div>
    <h1>NEXORA TV</h1>
    <div class="subtitle">D.Y. Patil International University</div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="error-box" id="errBox"></div>

    <div class="setup" id="setup">
      <h2>Set up this display</h2>
      <label for="srv">Server address</label>
      <input id="srv" type="text" placeholder="http://10.100.0.39:5000" autocomplete="off">
      <label for="scr">Screen ID (leave empty to pair automatically)</label>
      <input id="scr" type="text" placeholder="automatic" autocomplete="off">
      <label for="key">Device key (leave empty if not required)</label>
      <input id="key" type="text" placeholder="optional" autocomplete="off">
      <button id="save" type="button">Save &amp; connect</button>
      <button id="repair" type="button" style="background:transparent;color:#EEE3B0;border-color:#EEE3B0;margin-top:10px">Re-pair this TV</button>
      <div class="hint">Press the YELLOW button at any time to open this screen again.</div>
    </div>
  </div>

  <script>
    // ─── CONFIG (set once on this TV; stored locally, nothing hard-coded) ───
    var DEFAULT_SERVER = '__NEXORA_SERVER__'; // replaced when the IPK is built
    var LS = window.localStorage;
    function cfg() {
      return {
        server: (LS.getItem('nexora_server') || DEFAULT_SERVER).replace(/\/+$/, ''),
        screen: LS.getItem('nexora_screen') || '',
        key: LS.getItem('nexora_key') || ''
      };
    }
    function $(id) { return document.getElementById(id); }

    function playerUrl(c) {
      // The player is served by the same server (production build on :5000, or dev server on :3000).
      // No screen id stored here = the player page pairs this TV itself (shows a code to adopt in the CMS).
      var url = c.server + '/tv?kiosk=1&ticker=1';
      if (c.screen) url += '&tv=' + encodeURIComponent(c.screen);
      if (c.key) url += '&key=' + encodeURIComponent(c.key);
      return url;
    }

    function showError(msg) { var b = $('errBox'); b.style.display = 'block'; b.textContent = msg; }

    var retryTimer = null;
    function showSetup() {
      clearTimeout(retryTimer);
      var c = cfg();
      $('srv').value = c.server; $('scr').value = c.screen; $('key').value = c.key;
      $('setup').style.display = 'block';
      $('srv').focus();
    }

    function tryConnect(attempt) {
      var c = cfg();
      if (!c.server) { showSetup(); return; }
      attempt = attempt || 1;
      var img = new Image();
      var done = false;
      var timeout = setTimeout(function () { if (!done) { done = true; fail(); } }, 6000);
      function fail() {
        if (attempt < 5) {
          showError('Connecting to NEXORA server... (attempt ' + attempt + '/5)');
          retryTimer = setTimeout(function () { tryConnect(attempt + 1); }, 3000);
        } else {
          showError('Cannot reach ' + c.server + '. Check Wi-Fi / server address (press YELLOW to edit). Retrying in 10 seconds...');
          retryTimer = setTimeout(function () { tryConnect(1); }, 10000);
        }
      }
      img.onload = function () { if (done) return; done = true; clearTimeout(timeout); window.location.replace(playerUrl(c)); };
      img.onerror = function () { if (done) return; done = true; clearTimeout(timeout); fail(); };
      img.src = c.server + '/dypiu-logo.png?t=' + Date.now();
    }

    $('repair').onclick = function () {
      // Forget the screen id remembered by the player page and show a new pairing code.
      LS.removeItem('nexora_screen'); LS.removeItem('nexora_key');
      window.location.replace(cfg().server + '/tv?kiosk=1&ticker=1&pair=1');
    };

    $('save').onclick = function () {
      var srv = $('srv').value.trim();
      if (srv && !/^https?:\/\//i.test(srv)) srv = 'http://' + srv;
      LS.setItem('nexora_server', srv);
      LS.setItem('nexora_screen', $('scr').value.trim());
      LS.setItem('nexora_key', $('key').value.trim());
      $('setup').style.display = 'none';
      $('errBox').style.display = 'none';
      tryConnect(1);
    };

    // YELLOW (405) or "S" opens the settings form
    document.addEventListener('keydown', function (e) {
      if (e.keyCode === 405 || e.keyCode === 83) showSetup();
    });

    setTimeout(function () { tryConnect(1); }, 1500);
  </script>
</body>
</html>
